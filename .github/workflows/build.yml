name: Build 3DS App Store (CIA)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t 3ds-appstore .

      - name: Extract Artifacts
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" 3ds-appstore sh -c "cp -v app.cia app.3dsx app.smdh /out/"

      - name: Upload CIA & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-appstore-cia
          path: out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            out/app.cia
            out/app.3dsx
            out/app.smdh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
